# Production profile — activated via SPRING_PROFILES_ACTIVE=prod.
#
# Every value below reads from an environment variable with NO fallback
# default, on purpose: this is the same "fail loudly, not silently" pattern
# application.yml's base DB_PASSWORD has always used (see its own comment).
# A missing required env var makes the app refuse to start with a clear
# "Could not resolve placeholder" error, instead of silently booting with an
# empty secret or writing uploads to ephemeral local disk. The one deliberate
# exception is S3_ENDPOINT, which is genuinely optional (blank = real AWS
# S3, per S3StorageProvider's own Javadoc) — not an oversight.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    # Kept configured even though MAIL_PROVIDER=brevo-api is what's actually
    # active on Railway (see app.mail.provider below) — Spring Boot's mail
    # autoconfiguration creates this JavaMailSender bean whenever host is
    # set, regardless of app.mail.provider, but nothing injects it once
    # EmailSender's own @ConditionalOnProperty keeps it from being created.
    # An unused bean, not a problem — left in case a future host doesn't
    # block outbound SMTP the way Railway does. See BrevoApiEmailSender's
    # Javadoc for why raw SMTP had to be abandoned here specifically.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Found live: without these, an unreachable/blocked SMTP port
          # (many PaaS hosts restrict outbound 587 by default) hangs
          # JavaMailSender indefinitely instead of failing — which,
          # through AuthServiceImpl.forgotPassword's synchronous send,
          # hung the whole HTTP request (observed: 2+ minutes, no
          # response). All three timeouts matter: connection alone isn't
          # enough if the TLS handshake or the send itself is what stalls.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cors:
    # Comma-separated (e.g. a Vercel preview URL + the final production
    # domain) — CorsProperties already binds this to a List<String>, Spring's
    # relaxed binding turns a comma-separated env var into a list for free.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # The single real production frontend URL a password-reset email's link
  # should point at — see the base application.yml's comment for why this
  # isn't just reused from CORS_ALLOWED_ORIGINS.
  frontend-url: ${FRONTEND_URL}
  mail:
    # brevo-api, not smtp — Railway blocks outbound SMTP at the platform
    # level (confirmed: identical connection failures on both port 587 and
    # Brevo's documented 2525 fallback), so EmailSender's raw-SMTP path can
    # never work here regardless of credentials. BrevoApiEmailSender reaches
    # the same Brevo account over HTTPS instead, which Railway does allow
    # (same protocol Gemini/Cloudinary/Razorpay already use successfully).
    # No default — an unrecognized/missing value here should fail loudly at
    # startup (see this file's own header comment), not silently fall back
    # to a channel already proven broken on this host.
    provider: ${MAIL_PROVIDER}
    brevo:
      # A Brevo API key, NOT the SMTP key used by the (now-unused-on-Railway)
      # spring.mail.* block above — separate credential, separate tab in the
      # Brevo dashboard (account icon -> SMTP & API -> API Keys). Only read
      # when provider=brevo-api actually constructs BrevoApiEmailSender.
      api-key: ${BREVO_API_KEY}
  jwt:
    secret: ${JWT_SECRET}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  ai-crop-doctor:
    # Only read when crop-doctor.provider=local — Phase 1 made Gemini the
    # active provider and demoted this to a disabled fallback (see
    # AiServiceClientImpl/LocalModelProvider, both @ConditionalOnProperty).
    # Safe to leave AI_SERVICE_URL/AI_SERVICE_API_KEY unset on Railway as
    # long as the default (gemini) provider stays active — this bean is
    # then never constructed, so these placeholders are never resolved. No
    # default here regardless: if someone does opt into provider=local
    # without setting real values, that should fail loudly at startup, not
    # silently proceed with a placeholder.
    service-url: ${AI_SERVICE_URL}
    api-key: ${AI_SERVICE_API_KEY}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
  chat-assistant:
    # Kill switch for the AI Chat Assistant specifically — independent of
    # AI Crop Doctor, since they're separate Gemini quota concerns in
    # practice even though they share one API key. Defaults to enabled
    # (unset = true) so this is opt-out, not opt-in — flip
    # CHAT_ASSISTANT_ENABLED=false in Railway to hide the widget and
    # short-circuit the endpoints, no redeploy or code change needed either
    # direction. GET /api/v1/chat/config exposes this value publicly so the
    # frontend (a separate Vercel deployment with no access to Railway env
    # vars) can hide the floating button entirely rather than just disabling it.
    enabled: ${CHAT_ASSISTANT_ENABLED:true}

crop-doctor:
  provider: ${CROP_DOCTOR_PROVIDER:gemini}

storage:
  # local, s3, or cloudinary — deliberately no default here either: silently
  # falling back to local-disk storage in production (files gone on next
  # redeploy) is exactly the kind of silent failure this profile exists to
  # prevent. Only the block matching the chosen provider needs its env vars
  # actually set — the other provider's bean is never constructed
  # (@ConditionalOnProperty), so its placeholders are never resolved.
  provider: ${STORAGE_PROVIDER}
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    endpoint: ${S3_ENDPOINT:}
    public-url-base: ${S3_PUBLIC_URL_BASE}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

server:
  # Most PaaS hosts (Railway, Render, etc.) terminate HTTPS at their edge and
  # forward plain HTTP internally. Without this, the app can't tell the
  # original request was HTTPS — which matters here specifically because the
  # refresh-token cookie is Secure(true) (Module 2) and Spring Security's
  # redirect/URL-building logic also assumes the scheme it sees is the real
  # one. "framework" delegates to Spring's own ForwardedHeaderFilter, reading
  # the standard X-Forwarded-Proto/X-Forwarded-Host headers.
  forward-headers-strategy: framework
