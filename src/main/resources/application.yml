spring:
  config:
    import: "optional:file:./application-local.yml"
  application:
    name: sg-krashi-server
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:sgkrashi_dev}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Set above MediaServiceImpl's 5MB application-level limit, so an
      # oversized upload reaches that check (a clean 400) instead of being
      # rejected by the servlet container first (a raw 500).
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
