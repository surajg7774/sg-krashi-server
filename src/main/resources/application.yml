spring:
  config:
    import: "optional:file:./application-local.yml"
  application:
    name: sg-krashi-server
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:sgkrashi_dev}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Set above MediaServiceImpl's 5MB application-level limit, so an
      # oversized upload reaches that check (a clean 400) instead of being
      # rejected by the servlet container first (a raw 500).
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # Local dev: Mailpit (`docker run -d -p 1025:1025 -p 8025:8025
    # axllent/mailpit`), a real SMTP server that catches mail instead of
    # delivering it — web UI at http://localhost:8025. No auth/TLS needed.
    # A real deployment would override host/port/username/password (via
    # application-local.yml, same pattern as DB_PASSWORD/JWT_SECRET) to
    # point at an actual provider.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  cors:
    allowed-origins: http://localhost:5173
  # Used to build the actual clickable link in a password-reset email
  # (frontend-url + /reset-password?token=...) — deliberately a single value,
  # not reused from app.cors.allowed-origins, since that's a list (could have
  # a preview URL alongside the real domain) and there's only ever one right
  # place to send a user to click through.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  mail:
    from-address: ${MAIL_FROM:no-reply@sgkrashi.com}
    # smtp (default, EmailSender/Mailpit) or brevo-api (BrevoApiEmailSender,
    # HTTPS-based — see its Javadoc). Unset here on purpose: matchIfMissing on
    # EmailSender's @ConditionalOnProperty makes local dev default to smtp
    # without needing this line, same as crop-doctor.provider's own pattern.
    # brevo.api-key is only ever read when provider=brevo-api.
  ai-crop-doctor:
    # Only read when crop-doctor.provider=local (Phase 1 demoted this to a
    # disabled fallback — see AiServiceClientImpl/LocalModelProvider). Points
    # at the local sg-krashi-ai-service dev server (see its README) if ever
    # re-enabled.
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY}
  chat-assistant:
    enabled: ${CHAT_ASSISTANT_ENABLED:true}
  google:
    # Empty default — see FirebaseConfig/FcmNotificationSender's identical
    # reasoning just below: this must boot fine before a real Google Cloud
    # project exists. GoogleAuthServiceImpl.isConfigured() is the actual
    # gate; POST /auth/mobile/google returns a clean 503
    # (GOOGLE_SIGN_IN_NOT_CONFIGURED) if hit before this is set, rather than
    # failing at boot. This is the WEB OAuth client ID specifically — not
    # the Android/iOS ones — see GoogleAuthServiceImpl's constructor Javadoc.
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  fcm:
    # Defaults to false/empty on purpose — FcmNotificationSender/FirebaseConfig
    # are only created when this is explicitly true (see FirebaseConfig's
    # Javadoc for why: a required-with-no-default service-account property
    # here would crash the whole app's boot the moment this feature was
    # merged, before Firebase even exists). Set FCM_ENABLED=true and
    # FIREBASE_SERVICE_ACCOUNT_JSON (the full service account JSON, as a
    # single-line string) once a real Firebase project is set up.
    enabled: ${FCM_ENABLED:false}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  gemini:
    # No default, same as JWT_SECRET/RAZORPAY_* above — set via
    # application-local.yml. Get a free key at aistudio.google.com/apikey.
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
  mandi:
    # Empty default, deliberately — unlike gemini/jwt/razorpay above, an
    # environment without MANDI_API_KEY set (e.g. local dev) must still boot
    # cleanly. MandiPriceApiClient.isConfigured()/MandiPriceSyncJob treat a
    # blank key as the expected, routine state, not a startup failure.
    api-key: ${MANDI_API_KEY:}
    base-url: ${MANDI_BASE_URL:https://api.data.gov.in}
    # "Current daily price of various commodities from various markets
    # (Mandi)" — Ministry of Agriculture & Farmers Welfare / Agmarknet.
    resource-id: ${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
  geocoding:
    # No key needed — same free Open-Meteo service app.weather's own
    # base-url (WeatherApiClient) already calls.
    base-url: ${GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}

# Dairy. Every value has a safe default; nothing here is required. Both subscription switches are OFF by default:
# with subscriptions.enabled=false customers cannot create subscriptions (the web hides the screens), and with
# subscriptions.job-enabled=false the nightly job does nothing at all (no deliveries, no stock changes, no notifications).
dairy:
  subscriptions:
    enabled: ${DAIRY_SUBSCRIPTIONS_ENABLED:false}
    job-enabled: ${DAIRY_SUBSCRIPTIONS_JOB_ENABLED:false}
    max-quantity: ${DAIRY_SUBSCRIPTIONS_MAX_QUANTITY:20}
  delivery:
    min-lead-days: ${DAIRY_DELIVERY_MIN_LEAD_DAYS:1}
    window-days: ${DAIRY_DELIVERY_WINDOW_DAYS:7}

crop-doctor:
  # gemini (default) or local — see CropAnalysisProvider implementations.
  provider: ${CROP_DOCTOR_PROVIDER:gemini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
