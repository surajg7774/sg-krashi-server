spring:
  config:
    import: "optional:file:./application-local.yml"
  application:
    name: sg-krashi-server
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:sgkrashi_dev}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Set above MediaServiceImpl's 5MB application-level limit, so an
      # oversized upload reaches that check (a clean 400) instead of being
      # rejected by the servlet container first (a raw 500).
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # Local dev: Mailpit (`docker run -d -p 1025:1025 -p 8025:8025
    # axllent/mailpit`), a real SMTP server that catches mail instead of
    # delivering it — web UI at http://localhost:8025. No auth/TLS needed.
    # A real deployment would override host/port/username/password (via
    # application-local.yml, same pattern as DB_PASSWORD/JWT_SECRET) to
    # point at an actual provider.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  mail:
    from-address: ${MAIL_FROM:no-reply@sgkrashi.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
